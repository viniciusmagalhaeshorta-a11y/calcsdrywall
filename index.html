<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicador!</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configure the PDF.js web worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        /* CSS resets for uniform rendering across different browsers */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Styling for the drag-and-drop zone using a label element */
        .drop-zone {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 50px 20px;
            background-color: #ebf5fb;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: block; /* Ensures label fills container like a div */
            -webkit-tap-highlight-color: transparent;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background-color: #d6eaf8;
            border-color: #2980b9;
        }

        .drop-zone-text {
            font-size: 16px;
            font-weight: bold;
            color: #2980b9;
            pointer-events: none;
        }

        /* iOS-safe method for hiding file inputs */
        #fileInput {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
            opacity: 0;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #27ae60;
            min-height: 20px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .drop-zone {
                padding: 30px 10px;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Duplicador</h1>
        <p>Faça o upload de uma imagem ou PDF. A ferramenta dobrará automaticamente a largura, duplicará o conteúdo lado a lado e solicitará que você salve o novo arquivo.</p>

        <!-- Converted to <label> for cross-browser native activation -->
        <label class="drop-zone" id="dropZone" for="fileInput">
            <span class="drop-zone-text">Arraste e solte o arquivo aqui<br><br>ou clique para procurar</span>
            <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg, application/pdf">
        </label>

        <div id="status"></div>
    </div>

    <script>
        // DOM Elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('status');

        // Drag and Drop listeners
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // Event Listener for File Selection via Browse
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Main function to route files based on type
        function handleFile(file) {
            statusText.style.color = '#333';
            statusText.innerText = 'Processing... Please wait.';

            const fileType = file.type;

            if (fileType.includes('image')) {
                processImage(file);
            } else if (fileType === 'application/pdf') {
                processPDF(file);
            } else {
                statusText.style.color = '#c0392b';
                statusText.innerText = 'Error: Please upload a valid Image (JPG/PNG) or PDF file.';
            }
            
            // Reset input so the same file can be re-selected if needed
            fileInput.value = "";
        }

        // Logic for handling standard images
        function processImage(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    createSideBySideAndDownload(img, getFilenameWithoutExtension(file.name));
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        // Logic for handling PDFs via PDF.js
        async function processPDF(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const typedarray = new Uint8Array(arrayBuffer);
                
                const loadingTask = pdfjsLib.getDocument(typedarray);
                const pdf = await loadingTask.promise;
                
                const page = await pdf.getPage(1);
                
                const scale = 3; 
                const viewport = page.getViewport({ scale: scale });
                
                const tempCanvas = document.createElement('canvas');
                const context = tempCanvas.getContext('2d');
                tempCanvas.height = viewport.height;
                tempCanvas.width = viewport.width;
                
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                await page.render(renderContext).promise;
                
                createSideBySideAndDownload(tempCanvas, getFilenameWithoutExtension(file.name));

            } catch (error) {
                console.error("PDF Processing Error:", error);
                statusText.style.color = '#c0392b';
                statusText.innerText = 'Error processing PDF. Please try an image.';
            }
        }

        // Duplication logic
        function createSideBySideAndDownload(sourceMedia, originalFilename) {
            const finalCanvas = document.createElement('canvas');
            const ctx = finalCanvas.getContext('2d');

            const singleWidth = sourceMedia.width;
            const singleHeight = sourceMedia.height;
            
            finalCanvas.width = singleWidth * 2;
            finalCanvas.height = singleHeight;

            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

            ctx.drawImage(sourceMedia, 0, 0, singleWidth, singleHeight);
            ctx.drawImage(sourceMedia, singleWidth, 0, singleWidth, singleHeight);

            triggerDownload(finalCanvas, originalFilename);
        }

        // iOS Safari safe download handler
        function triggerDownload(canvas, originalFilename) {
            canvas.toBlob((blob) => {
                if (!blob) {
                    statusText.style.color = '#c0392b';
                    statusText.innerText = 'Error generating image.';
                    return;
                }

                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `${originalFilename}_side_by_side.png`;
                link.href = url;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Clean up Blob memory after short delay
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                statusText.style.color = '#27ae60';
                statusText.innerText = 'Success! Your file is ready.';
                
                setTimeout(() => {
                    if (statusText.innerText.includes('Success')) {
                        statusText.innerText = '';
                    }
                }, 5000);
            }, 'image/png', 1.0);
        }

        // Helper function
        function getFilenameWithoutExtension(filename) {
            return filename.substring(0, filename.lastIndexOf('.')) || filename;
        }
    </script>
</body>
</html>
